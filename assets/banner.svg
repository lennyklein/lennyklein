<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  
  <!-- Hintergrund mit abgerundeten Ecken -->
  <rect width="500" height="150" rx="16" fill="url(#bgGrad)" />
  
  <!-- Tech-Akzent: Terminal-Klammern / Admin-Symbol -->
  <text x="35" y="95" font-family="monospace" font-size="65" font-weight="bold" fill="#38bdf8">&gt;</text>
  <text x="75" y="95" font-family="monospace" font-size="65" font-weight="bold" fill="#334155">_</text>
  
  <!-- Dein Name -->
  <text x="120" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="url(#textGrad)" letter-spacing="1">LENNY KLEIN</text>
  
  <!-- Optimierter Untertitel: Präzise auf Backend & Automatisierung angepasst -->
  <text x="124" y="115" font-family="monospace" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="2.5">BACKEND &amp; AUTOMATION</text>
  
  <!-- Kleiner technischer Akzentpunkt (Online/Status) -->
  <circle cx="455" cy="40" r="6" fill="#22c55e" />
</svg>

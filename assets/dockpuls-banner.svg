<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" height="100%">
  <defs>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap');
      
      .text-title {
        font-family: 'Inter', sans-serif, -apple-system, BlinkMacSystemFont;
        font-weight: 700;
        font-size: 52px;
        fill: #ffffff;
        letter-spacing: 3px;
      }
      .text-sub {
        font-family: 'Inter', sans-serif, -apple-system, BlinkMacSystemFont;
        font-weight: 400;
        font-size: 13px;
        fill: #8a99ad;
        letter-spacing: 1.5px;
      }

      .pulse-path {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: drawPulse 3s ease-in-out infinite, pulseGlow 1.5s ease-in-out infinite alternate;
      }

      @keyframes drawPulse {
        0% {
          stroke-dashoffset: 1000;
          opacity: 0.2;
        }
        50% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        100% {
          stroke-dashoffset: -1000;
          opacity: 0.2;
        }
      }

      @keyframes pulseGlow {
        0% {
          filter: drop-shadow(0 0 4px rgba(0, 198, 255, 0.4));
        }
        100% {
          filter: drop-shadow(0 0 14px rgba(0, 198, 255, 0.9));
        }
      }
    </style>
  </defs>

  <!-- Hintergrund -->
  <rect width="100%" height="100%" fill="#1a1e24" />

  <!-- EKG Puls Linie (Links) -->
  <g transform="translate(60, -12)">
    <path class="pulse-path"
          d="M 20 137 
             L 100 137 
             L 130 137 
             L 150 105 
             L 175 175 
             L 200 50 
             L 225 210 
             L 250 120 
             L 275 137 
             L 305 137 
             L 380 137" 
          fill="none" 
          stroke="url(#pulseGrad)" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Text-Bereich (Rechts) -->
  <g transform="translate(440, 0)">
    <text x="0" y="108" class="text-title">DOCKPULS</text>
    <text x="0" y="145" class="text-sub">REALTIME CONTAINER MONITOR | HOMELABS &amp; ZIMAOS</text>
  </g>
</svg>

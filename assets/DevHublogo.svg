svg_content = """<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b131a" />
      <stop offset="100%" stop-color="#020406" />
    </radialGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>

    <!-- Shield/Gavel Neon Blue Gradient -->
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f7ff" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
  </defs>

  <!-- Solid Black Background with Circle Base -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="8" />

  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#00b4d8" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 4" />

  <!-- Shield Shape -->
  <g filter="url(#glow)">
    <path d="M 256 100 
             C 330 100, 365 115, 365 160 
             C 365 240, 310 300, 256 345 
             C 202 300, 147 240, 147 160 
             C 147 115, 182 100, 256 100 Z" 
          fill="#071b28" stroke="url(#neonBlue)" stroke-width="6" stroke-linejoin="round" />
  </g>

  <!-- Gavel Icon inside Shield -->
  <g filter="url(#glow)" transform="translate(0, 5)">
    <!-- Gavel Handle -->
    <rect x="244" y="170" width="24" height="120" rx="12" fill="url(#neonBlue)" />
    <circle cx="256" cy="295" r="14" fill="#00b4d8" />

    <!-- Gavel Head (Horizontal Block) -->
    <rect x="206" y="145" width="100" height="42" rx="10" fill="url(#neonBlue)" />
    <!-- Gavel End Caps -->
    <rect x="198" y="140" width="14" height="52" rx="6" fill="#e0f7ff" />
    <rect x="300" y="140" width="14" height="52" rx="6" fill="#e0f7ff" />
  </g>

  <!-- Code Bracket / Syntax Symbol next to Gavel -->
  <g filter="url(#glow)" transform="translate(290, 200)">
    <text x="0" y="30" fill="#00d2ff" font-family="monospace" font-weight="bold" font-size="44" letter-spacing="2">/{}</text>
  </g>

  <!-- Typography: DEVHUB -->
  <text x="256" y="395" 
        fill="#ffffff" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="42" 
        font-weight="900" 
        letter-spacing="4" 
        text-anchor="middle"
        filter="url(#glow)">DEVHUB</text>

  <!-- Typography: RULES -->
  <text x="256" y="435" 
        fill="#00b4d8" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="22" 
        font-weight="700" 
        letter-spacing="6" 
        text-anchor="middle">RULES</text>
</svg>
"""

with open("devhub_rules_icon.svg", "w", encoding="utf-8") as f:
    f.write(svg_content)

print("SVG erfolgreich erstellt!")
